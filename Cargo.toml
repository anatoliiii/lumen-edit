[workspace]
members = [".", "shared", "agent"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[package]
name = "codium-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust code editor with SSH remote, LSP, terminal and git"

[[bin]]
name = "codium-rs"
path = "src/main.rs"

[dependencies]
codium-shared = { path = "shared" }
eframe = "=0.36.2"
rfd = "=0.17.2"
ropey = "1.6"
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-python = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
vt100 = "0.16"
portable-pty = "0.9"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
notify = "8"
toml = "0.9"
dirs = "6"
nucleo-matcher = "0.3"
similar = "2"
regex = "1"
url = "2"
shell-words = "1"
png = "0.18"
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
