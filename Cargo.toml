[workspace]
members = [".", "shared", "agent"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
authors = ["Анатолий Копейкин"]
repository = "https://github.com/anatoliiii/lumen-edit"
homepage = "https://github.com/anatoliiii/lumen-edit"
rust-version = "1.95"

[package]
name = "lumen-edit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native Rust code editor with SSH remote, LSP, terminal and git"
readme = "README.md"
keywords = ["editor", "ide", "ssh", "lsp", "egui"]
categories = ["development-tools", "text-editors"]
rust-version.workspace = true

[[bin]]
name = "lumen-edit"
path = "src/main.rs"

[dependencies]
lumen-shared = { path = "shared" }
eframe = "=0.37.0"
rfd = "=0.17.2"
egui_extras = { version = "=0.37.0", features = ["image", "svg_text", "gif", "webp"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
ropey = "1.6"
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-python = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-make = "1.1"
tree-sitter-groovy = "0.1"
tree-sitter-hcl = "1.1"
vt100 = "0.17"
portable-pty = "0.9"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
notify = "8"
toml = "1.1"
dirs = "6"
nucleo-matcher = "0.3"
similar = "2"
regex = "1"
url = "2"
shell-words = "1"
png = "0.18"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }


[target.'cfg(windows)'.dependencies]
# AF_UNIX sockets (Windows 10 1803+) for the control socket.
uds_windows = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
# Reads font charmaps in the glyph test (already used by egui).
skrifa = "0.48"
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
