name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            suffix: ""
          - os: macos-latest
            platform: macos
            suffix: ""
          - os: windows-latest
            platform: windows
            suffix: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The SSH test uploads the real lumen-agent binary.
      - run: cargo build --workspace
      - run: cargo test --workspace
      - uses: actions/upload-artifact@v7
        with:
          name: lumen-edit-${{ matrix.platform }}
          path: |
            target/debug/lumen-edit${{ matrix.suffix }}
            target/debug/lumen-agent${{ matrix.suffix }}
          if-no-files-found: error
